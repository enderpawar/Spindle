<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 라이트 탭 화면이 대부분이라 상태바도 앱 배경(--l-bg)과 같은 톤으로 맞춘다. -->
    <meta name="theme-color" content="#f4f8ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Spindle" />
    <!-- black-translucent를 쓰면 iOS 홈화면 실행에서 레이아웃 뷰포트가 상태바 높이만큼
         짧게 잡혀, 화면 바닥에 터치도 안 되는 흰 띠가 남는다(하단 내비게이션이 뜨는
         문제의 원인). default는 상태바 아래부터 정확한 크기의 뷰포트를 받는다. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <meta name="description" content="휴대폰을 돌려 가리키는 방향의 숨은 부산을 발견하는 스핀 탐색 서비스" />
    <title>Spindle — 숨은 부산을 스핀하세요</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
